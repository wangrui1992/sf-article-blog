<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>草稿箱</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d1117; --bg-card: #161b22; --border: #30363d;
      --accent: #58a6ff; --accent-green: #3fb950; --accent-orange: #f78166;
      --accent-red: #f85149; --text: #e6edf3; --text-secondary: #8b949e;
    }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    .sidebar {
      position: fixed; left: 0; top: 0; width: 240px; height: 100vh;
      background: var(--bg-card); border-right: 1px solid var(--border); padding: 24px 16px;
    }
    .sidebar-logo { font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 500; margin-bottom: 32px; padding-left: 12px; }
    .nav-item {
      display: flex; align-items: center; gap: 12px; padding: 12px;
      color: var(--text-secondary); text-decoration: none; border-radius: 8px;
      margin-bottom: 4px; font-size: 14px; transition: all 0.2s;
    }
    .nav-item:hover, .nav-item.active { background: rgba(88,166,255,0.1); color: var(--accent); }
    .main { margin-left: 240px; padding: 32px; }
    .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
    .page-header h1 { font-size: 28px; font-weight: 600; }
    .btn {
      padding: 10px 20px; border-radius: 8px; font-size: 14px; font-weight: 500;
      cursor: pointer; text-decoration: none; transition: opacity 0.2s;
    }
    .btn-primary { background: var(--accent); color: #0d1117; border: none; }
    .filters { display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
    .filters select, .filters input {
      padding: 8px 12px; background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 6px; color: var(--text); font-size: 14px;
    }
    .filters select:focus, .filters input:focus { outline: none; border-color: var(--accent); }
    .article-table {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 12px; overflow: hidden;
    }
    .article-table table { width: 100%; border-collapse: collapse; }
    .article-table th, .article-table td {
      padding: 16px; text-align: left; border-bottom: 1px solid var(--border);
    }
    .article-table th {
      background: rgba(88,166,255,0.05); font-size: 12px; font-weight: 600;
      color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em;
    }
    .article-table tr:last-child td { border-bottom: none; }
    .article-table tr:hover td { background: rgba(88,166,255,0.02); }
    .article-title { font-weight: 500; max-width: 300px; }
    .article-title a { color: var(--text); text-decoration: none; }
    .article-title a:hover { color: var(--accent); }
    .badge {
      display: inline-block; padding: 4px 8px; border-radius: 4px;
      font-size: 11px; font-weight: 500;
    }
    .badge-published { background: rgba(63,185,80,0.1); color: var(--accent-green); }
    .badge-draft { background: rgba(227,179,65,0.1); color: #e3b341; }
    .badge-deleted { background: rgba(248,81,73,0.1); color: var(--accent-red); }
    .actions { display: flex; gap: 8px; }
    .actions button {
      padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer;
      background: transparent; border: 1px solid var(--border); color: var(--text-secondary);
    }
    .actions button:hover { border-color: var(--accent); color: var(--accent); }
    .actions .delete:hover { border-color: var(--accent-red); color: var(--accent-red); }
    .pagination { display: flex; justify-content: center; gap: 8px; margin-top: 24px; }
    .pagination button {
      padding: 8px 16px; border-radius: 6px; background: var(--bg-card);
      border: 1px solid var(--border); color: var(--text); cursor: pointer;
    }
    .pagination button.active { background: var(--accent); color: #0d1117; border-color: var(--accent); }
    .pagination button:disabled { opacity: 0.5; cursor: not-allowed; }
    .loading { text-align: center; padding: 40px; color: var(--text-secondary); }
    .empty { text-align: center; padding: 60px; color: var(--text-secondary); }
  </style>
</head>
<body>
  <nav class="sidebar">
    <div class="sidebar-logo">~/admin</div>
    <a href="/dashboard" class="nav-item">📊 仪表盘</a>
    <a href="/article/list" class="nav-item">📝 文章管理</a>
    <a href="/article/create" class="nav-item">✏️ 写文章</a>
    <a href="/article/drafts" class="nav-item active">📁 草稿箱</a>
    <a href="/admin/tags" class="nav-item">🏷️ 标签管理</a>
    <a href="/admin/users" class="nav-item">👥 用户管理</a>
    <a href="/auth/logout" class="nav-item">🚪 退出登录</a>
  </nav>

  <main class="main">
    <div class="page-header">
      <h1>草稿箱</h1>
      <a href="/article/create" class="btn btn-primary">+ 新建文章</a>
    </div>

    <div class="filters">
      <input type="text" id="searchInput" placeholder="搜索标题..." onkeyup="searchOnEnter(event)">
      <button class="btn btn-secondary" onclick="loadArticles()">搜索</button>
    </div>

    <div class="article-table">
      <table>
        <thead>
          <tr>
            <th>标题</th>
            <th>作者</th>
            <th>状态</th>
            <th>更新时间</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="articleList">
          <tr><td colspan="5" class="loading">加载中...</td></tr>
        </tbody>
      </table>
    </div>

    <div class="pagination" id="pagination"></div>
  </main>

  <script>
    let currentPage = 1;

    async function loadArticles(page = 1) {
      currentPage = page;
      const keyword = document.getElementById('searchInput').value;

      const params = new URLSearchParams({ page, status: 'draft', keyword });
      document.getElementById('articleList').innerHTML = '<tr><td colspan="5" class="loading">加载中...</td></tr>';

      try {
        const response = await fetch(`/article/api/list?${params}`);
        const result = await response.json();

        if (result.articles && result.articles.length > 0) {
          renderArticles(result.articles);
          renderPagination(result.current_page, result.pages);
        } else {
          document.getElementById('articleList').innerHTML = '<tr><td colspan="5" class="empty">暂无草稿</td></tr>';
          document.getElementById('pagination').innerHTML = '';
        }
      } catch (err) {
        document.getElementById('articleList').innerHTML = '<tr><td colspan="5" class="empty">加载失败</td></tr>';
      }
    }

    function renderArticles(articles) {
      document.getElementById('articleList').innerHTML = articles.map(a => `
        <tr>
          <td class="article-title">
            <a href="/article/edit/${a.id}">${escapeHtml(a.title)}</a>
          </td>
          <td>${a.author ? a.author.username : '-'}</td>
          <td><span class="badge badge-${a.status}">${statusText(a.status)}</span></td>
          <td>${a.updated_at ? a.updated_at.slice(0, 10) : '-'}</td>
          <td class="actions">
            <button onclick="location.href='/article/edit/${a.id}'">编辑</button>
            <button onclick="publishArticle(${a.id})">发布</button>
            <button onclick="deleteArticle(${a.id})" class="delete">删除</button>
          </td>
        </tr>
      `).join('');
    }

    function renderPagination(current, total) {
      if (total <= 1) {
        document.getElementById('pagination').innerHTML = '';
        return;
      }

      let html = `<button ${current === 1 ? 'disabled' : ''} onclick="loadArticles(${current - 1})">上一页</button>`;
      for (let i = 1; i <= total; i++) {
        if (i === 1 || i === total || (i >= current - 2 && i <= current + 2)) {
          html += `<button class="${i === current ? 'active' : ''}" onclick="loadArticles(${i})">${i}</button>`;
        } else if (i === current - 3 || i === current + 3) {
          html += '<button disabled>...</button>';
        }
      }
      html += `<button ${current === total ? 'disabled' : ''} onclick="loadArticles(${current + 1})">下一页</button>`;
      document.getElementById('pagination').innerHTML = html;
    }

    async function publishArticle(id) {
      if (!confirm('确定要发布这篇文章吗？')) return;
      try {
        const response = await fetch(`/article/api/${id}/publish`, { method: 'POST' });
        const result = await response.json();
        if (result.success) {
          loadArticles(currentPage);
        } else {
          alert(result.error || '发布失败');
        }
      } catch (err) {
        alert('发布失败');
      }
    }

    async function deleteArticle(id) {
      if (!confirm('确定要删除这篇草稿吗？')) return;
      try {
        const response = await fetch(`/article/api/${id}`, { method: 'DELETE' });
        const result = await response.json();
        if (result.success) {
          loadArticles(currentPage);
        } else {
          alert(result.error);
        }
      } catch (err) {
        alert('删除失败');
      }
    }

    function searchOnEnter(e) {
      if (e.key === 'Enter') loadArticles();
    }

    function statusText(status) {
      return { published: '已发布', draft: '草稿', deleted: '已删除' }[status] || status;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    loadArticles();
  </script>
</body>
</html>
