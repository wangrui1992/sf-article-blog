<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 博客管理系统</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0d1117 0%, #161b22 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #e6edf3;
    }
    .login-container { width: 100%; max-width: 400px; padding: 20px; }
    .login-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    .login-header { text-align: center; margin-bottom: 32px; }
    .login-header h1 { font-size: 24px; font-weight: 600; margin-bottom: 8px; }
    .login-header p { color: #8b949e; font-size: 14px; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 8px; }
    .form-group input {
      width: 100%; padding: 12px 16px;
      background: #0d1117; border: 1px solid #30363d;
      border-radius: 8px; color: #e6edf3; font-size: 14px;
      transition: border-color 0.2s;
    }
    .form-group input:focus { outline: none; border-color: #58a6ff; }
    .form-group input::placeholder { color: #6e7681; }
    .btn-login {
      width: 100%; padding: 12px;
      background: #58a6ff; color: #0d1117;
      border: none; border-radius: 8px;
      font-size: 14px; font-weight: 600; cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn-login:hover { opacity: 0.85; }
    .login-footer { text-align: center; margin-top: 24px; font-size: 13px; color: #8b949e; }
    .login-footer a { color: #58a6ff; text-decoration: none; }
    .error-msg {
      background: rgba(248,81,73,0.1); border: 1px solid rgba(248,81,73,0.3);
      color: #f85149; padding: 12px; border-radius: 8px;
      margin-bottom: 20px; font-size: 13px; display: none;
    }
    .success-msg {
      background: rgba(63,185,80,0.1); border: 1px solid rgba(63,185,80,0.3);
      color: #3fb950; padding: 12px; border-radius: 8px;
      margin-bottom: 20px; font-size: 13px; display: none;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <h1>欢迎回来</h1>
        <p>登录到博客管理系统</p>
      </div>
      
      <div class="error-msg" id="errorMsg"></div>
      <div class="success-msg" id="successMsg"></div>
      
      <form id="loginForm">
        <div class="form-group">
          <label for="username">用户名</label>
          <input type="text" id="username" name="username" placeholder="请输入用户名" required>
        </div>
        
        <div class="form-group">
          <label for="password">密码</label>
          <input type="password" id="password" name="password" placeholder="请输入密码" required>
        </div>
        
        <button type="submit" class="btn-login">登 录</button>
      </form>
      
      <div class="login-footer">
        还没有账号？ <a href="/auth/register">立即注册</a>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorMsg = document.getElementById('errorMsg');
      errorMsg.style.display = 'none';
      
      const formData = {
        username: document.getElementById('username').value.trim(),
        password: document.getElementById('password').value
      };
      
      try {
        const response = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(formData)
        });
        
        const data = await response.json();
        
        if (data.success) {
          window.location.href = data.data.redirect;
        } else {
          errorMsg.textContent = data.error;
          errorMsg.style.display = 'block';
        }
      } catch (err) {
        errorMsg.textContent = '网络错误，请重试';
        errorMsg.style.display = 'block';
      }
    });
  </script>
</body>
</html>
