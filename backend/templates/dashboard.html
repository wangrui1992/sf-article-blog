<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>仪表盘 - 博客管理系统</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d1117; --bg-card: #161b22; --border: #30363d;
      --accent: #58a6ff; --accent-green: #3fb950; --accent-purple: #bc8cff;
      --accent-orange: #f78166; --text: #e6edf3; --text-secondary: #8b949e;
    }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    .sidebar {
      position: fixed; left: 0; top: 0; width: 240px; height: 100vh;
      background: var(--bg-card); border-right: 1px solid var(--border); padding: 24px 16px;
    }
    .sidebar-logo { font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 500; margin-bottom: 32px; padding-left: 12px; }
    .nav-item {
      display: flex; align-items: center; gap: 12px; padding: 12px;
      color: var(--text-secondary); text-decoration: none; border-radius: 8px;
      margin-bottom: 4px; font-size: 14px; transition: all 0.2s;
    }
    .nav-item:hover, .nav-item.active { background: rgba(88,166,255,0.1); color: var(--accent); }
    .main { margin-left: 240px; padding: 32px; }
    .page-header { margin-bottom: 32px; }
    .page-header h1 { font-size: 28px; font-weight: 600; }
    .page-header p { color: var(--text-secondary); margin-top: 4px; }
    .stats-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px; margin-bottom: 32px;
    }
    .stat-card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 12px; padding: 24px;
    }
    .stat-card .label { font-size: 13px; color: var(--text-secondary); margin-bottom: 8px; }
    .stat-card .value { font-family: 'JetBrains Mono', monospace; font-size: 32px; font-weight: 600; }
    .stat-card .change { font-size: 12px; margin-top: 8px; }
    .stat-card .change.up { color: var(--accent-green); }
    .chart-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-bottom: 32px; }
    @media (max-width: 1024px) { .chart-grid { grid-template-columns: 1fr; } }
    .card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 12px; padding: 24px;
    }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .card-title { font-size: 16px; font-weight: 600; }
    .chart-container { height: 300px; }
    .article-list { list-style: none; }
    .article-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 16px 0; border-bottom: 1px solid var(--border);
    }
    .article-item:last-child { border-bottom: none; }
    .article-title { font-size: 14px; }
    .article-date { font-size: 12px; color: var(--text-secondary); }
  </style>
</head>
<body>
    <nav class="sidebar">
    <div class="sidebar-logo">~/admin</div>
    <a href="/dashboard" class="nav-item active">📊 仪表盘</a>
    <a href="/article/list" class="nav-item">📝 文章管理</a>
    <a href="/article/create" class="nav-item">✏️ 写文章</a>
    <a href="/article/drafts" class="nav-item">📁 草稿箱</a>
    <a href="/admin/tags" class="nav-item">🏷️ 标签管理</a>
    <a href="/admin/users" class="nav-item">👥 用户管理</a>
    <a href="/admin/settings" class="nav-item">⚙️ 系统设置</a>
    <a href="/admin/backup" class="nav-item">💾 数据备份</a>
    <a href="/auth/logout" class="nav-item">🚪 退出登录</a>
  </nav>

  <main class="main">
    <div class="page-header">
      <h1>仪表盘</h1>
      <p>欢迎回来，查看您的博客数据概览</p>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="label">文章总数</div>
        <div class="value" id="totalArticles">--</div>
        <div class="change up" id="weeklyChange">↑ 本周 +0</div>
      </div>
      <div class="stat-card">
        <div class="label">用户总数</div>
        <div class="value" id="totalUsers">--</div>
        <div class="change up">↑ 活跃</div>
      </div>
      <div class="stat-card">
        <div class="label">总浏览量</div>
        <div class="value" id="totalViews">--</div>
        <div class="change up">↑ 较上月</div>
      </div>
      <div class="stat-card">
        <div class="label">本周新增</div>
        <div class="value" id="weeklyNew">--</div>
        <div class="change up">↑ 趋势良好</div>
      </div>
    </div>

    <div class="chart-grid">
      <div class="card">
        <div class="card-header">
          <span class="card-title">📈 文章发布趋势</span>
          <select id="trendDays" onchange="loadTrendChart()" style="background:#0d1117;border:1px solid #30363d;color:#e6edf3;padding:4px 8px;border-radius:4px;">
            <option value="7">近7天</option>
            <option value="14">近14天</option>
            <option value="30" selected>近30天</option>
          </select>
        </div>
        <div class="chart-container" id="trendChart"></div>
      </div>
      <div class="card">
        <div class="card-header">
          <span class="card-title">🏷️ 热门标签</span>
        </div>
        <div class="chart-container" id="tagChart"></div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <span class="card-title">📄 最新文章</span>
        <a href="/article/list" style="color:var(--accent);font-size:13px;">查看全部 →</a>
      </div>
      <ul class="article-list" id="recentArticles">
        <li style="color:var(--text-secondary);padding:20px;text-align:center;">加载中...</li>
      </ul>
    </div>
  </main>

  <script>
    async function loadStats() {
      try {
        const response = await fetch('/api/stats/overview');
        const result = await response.json();
        if (result.success) {
          const d = result.data;
          document.getElementById('totalArticles').textContent = d.total_articles || 0;
          document.getElementById('totalUsers').textContent = d.total_users || 0;
          document.getElementById('totalViews').textContent = formatNumber(d.total_views || 0);
          document.getElementById('weeklyNew').textContent = d.weekly_articles || 0;
          document.getElementById('weeklyChange').textContent = `↑ 本周 +${d.weekly_articles || 0}`;
          
          // 渲染最新文章
          if (d.popular_articles && d.popular_articles.length > 0) {
            const list = document.getElementById('recentArticles');
            list.innerHTML = d.popular_articles.slice(0, 5).map(a => `
              <li class="article-item">
                <span class="article-title">${escapeHtml(a.title)}</span>
                <span class="article-date">${a.view_count || 0} 阅读</span>
              </li>
            `).join('');
          }
        }
      } catch (err) {
        console.error('加载失败:', err);
        document.getElementById('recentArticles').innerHTML = '<li style="color:var(--accent-orange);padding:20px;">加载失败</li>';
      }
    }

    async function loadTrendChart() {
      const days = document.getElementById('trendDays').value;
      const chart = echarts.init(document.getElementById('trendChart'));
      
      try {
        const response = await fetch(`/api/stats/trend?days=${days}`);
        const result = await response.json();
        
        chart.setOption({
          tooltip: { trigger: 'axis', backgroundColor: '#161b22', borderColor: '#30363d', textStyle: { color: '#e6edf3' } },
          xAxis: {
            type: 'category', data: result.data.map(d => d.date.slice(5)),
            axisLine: { lineStyle: { color: '#30363d' } }, axisLabel: { color: '#8b949e' }
          },
          yAxis: {
            type: 'value', splitLine: { lineStyle: { color: '#21262d' } },
            axisLabel: { color: '#8b949e' }
          },
          series: [{
            data: result.data.map(d => d.articles),
            type: 'line', smooth: true,
            areaStyle: { color: 'rgba(88,166,255,0.1)' },
            lineStyle: { color: '#58a6ff' },
            itemStyle: { color: '#58a6ff' }
          }],
          grid: { left: 50, right: 20, top: 20, bottom: 30 }
        });
      } catch (err) {
        console.error('图表加载失败:', err);
      }
    }

    function loadTagChart() {
      const chart = echarts.init(document.getElementById('tagChart'));
      chart.setOption({
        tooltip: { trigger: 'item', backgroundColor: '#161b22', borderColor: '#30363d', textStyle: { color: '#e6edf3' } },
        series: [{
          type: 'pie', radius: ['40%', '70%'],
          data: [
            { value: 35, name: 'Python' }, { value: 25, name: '爬虫' },
            { value: 18, name: 'Scrapy' }, { value: 12, name: 'FastAPI' },
            { value: 10, name: '其他' }
          ],
          itemStyle: { borderRadius: 6, borderColor: '#0d1117', borderWidth: 2 },
          label: { color: '#8b949e' }
        }]
      });
    }

    function formatNumber(num) {
      if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
      if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
      return num.toString();
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    loadStats();
    loadTrendChart();
    loadTagChart();
  </script>
</body>
</html>
