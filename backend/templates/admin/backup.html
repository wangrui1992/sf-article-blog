<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数据备份</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg: #0d1117; --bg-card: #161b22; --border: #30363d; --accent: #58a6ff; --accent-green: #3fb950; --accent-orange: #f78166; --text: #e6edf3; --text-secondary: #8b949e; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    .sidebar { position: fixed; left: 0; top: 0; width: 240px; height: 100vh; background: var(--bg-card); border-right: 1px solid var(--border); padding: 24px 16px; }
    .sidebar-logo { font-family: monospace; font-size: 18px; font-weight: 500; margin-bottom: 32px; padding-left: 12px; }
    .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px; color: var(--text-secondary); text-decoration: none; border-radius: 8px; margin-bottom: 4px; font-size: 14px; transition: all 0.2s; }
    .nav-item:hover, .nav-item.active { background: rgba(88,166,255,0.1); color: var(--accent); }
    .main { margin-left: 240px; padding: 32px; max-width: 800px; }
    .page-header { margin-bottom: 32px; }
    .page-header h1 { font-size: 28px; font-weight: 600; }
    .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; margin-bottom: 24px; }
    .card h2 { font-size: 18px; font-weight: 600; margin-bottom: 16px; }
    .card p { color: var(--text-secondary); margin-bottom: 16px; font-size: 14px; line-height: 1.6; }
    .btn { padding: 10px 20px; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; border: none; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; transition: opacity 0.2s; }
    .btn-primary { background: var(--accent); color: #0d1117; }
    .btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn:hover { opacity: 0.85; }
    .btn-group { display: flex; gap: 12px; flex-wrap: wrap; }
    .export-options { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 20px; }
    .export-option {
      background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
      padding: 20px; text-align: center; cursor: pointer; transition: all 0.2s;
    }
    .export-option:hover { border-color: var(--accent); }
    .export-option.active { border-color: var(--accent); background: rgba(88,166,255,0.05); }
    .export-option .icon { font-size: 32px; margin-bottom: 8px; }
    .export-option .label { font-weight: 500; }
    .export-option .desc { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }
    .message { padding: 12px 16px; border-radius: 8px; margin-bottom: 20px; display: none; }
    .message.success { background: rgba(63,185,80,0.1); border: 1px solid rgba(63,185,80,0.3); color: var(--accent-green); }
    .message.error { background: rgba(248,81,73,0.1); border: 1px solid rgba(248,81,73,0.3); color: var(--accent-orange); }
  </style>
</head>
<body>
  <nav class="sidebar">
    <div class="sidebar-logo">~/admin</div>
    <a href="/dashboard" class="nav-item">📊 仪表盘</a>
    <a href="/article/list" class="nav-item">📝 文章管理</a>
    <a href="/admin/users" class="nav-item">👥 用户管理</a>
    <a href="/admin/settings" class="nav-item">⚙️ 系统设置</a>
    <a href="/admin/backup" class="nav-item active">💾 数据备份</a>
    <a href="/auth/logout" class="nav-item">🚪 退出登录</a>
  </nav>

  <main class="main">
    <div class="page-header">
      <h1>数据备份</h1>
    </div>

    <div id="message" class="message"></div>

    <div class="card">
      <h2>📤 导出数据</h2>
      <p>选择要导出的数据类型，系统将生成可下载的文件。</p>
      
      <div class="export-options">
        <div class="export-option" onclick="exportData('articles', 'json')">
          <div class="icon">📝</div>
          <div class="label">文章数据</div>
          <div class="desc">JSON 格式</div>
        </div>
        <div class="export-option" onclick="exportData('articles', 'csv')">
          <div class="icon">📊</div>
          <div class="label">文章数据</div>
          <div class="desc">CSV 格式</div>
        </div>
        <div class="export-option" onclick="exportData('all', 'json')">
          <div class="icon">💾</div>
          <div class="label">完整备份</div>
          <div class="desc">JSON 格式</div>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>📥 导入数据</h2>
      <p>从备份文件恢复数据。仅支持 JSON 格式文件。</p>
      
      <form id="importForm">
        <input type="file" id="importFile" accept=".json" style="margin-bottom: 16px;">
        <button type="button" class="btn btn-secondary" onclick="importData()">导入数据</button>
      </form>
    </div>

    <div class="card">
      <h2>⏰ 自动备份</h2>
      <p>设置自动备份计划，定期将数据导出到指定位置。</p>
      
      <div class="btn-group">
        <button class="btn btn-secondary" onclick="setBackupSchedule('daily')">每日备份</button>
        <button class="btn btn-secondary" onclick="setBackupSchedule('weekly')">每周备份</button>
        <button class="btn btn-secondary" onclick="setBackupSchedule('monthly')">每月备份</button>
      </div>
    </div>
  </main>

  <script>
    function showMessage(text, type) {
      const msg = document.getElementById('message');
      msg.textContent = text;
      msg.className = `message ${type}`;
      msg.style.display = 'block';
      setTimeout(() => msg.style.display = 'none', 5000);
    }

    async function exportData(type, format) {
      try {
        const response = await fetch(`/admin/api/backup/export?type=${type}&format=${format}`);
        
        if (format === 'csv') {
          // CSV 直接下载
          const blob = await response.blob();
          const url = window.URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `blog_backup_${new Date().toISOString().slice(0,10)}.${format}`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          window.URL.revokeObjectURL(url);
        } else {
          // JSON 显示结果
          const result = await response.json();
          if (result.success) {
            showMessage(`导出成功！共 ${result.data.articles?.length || 0} 篇文章`, 'success');
          }
        }
      } catch (err) {
        showMessage('导出失败', 'error');
      }
    }

    async function importData() {
      const fileInput = document.getElementById('importFile');
      const file = fileInput.files[0];
      
      if (!file) {
        showMessage('请选择要导入的文件', 'error');
        return;
      }

      if (!file.name.endsWith('.json')) {
        showMessage('仅支持 JSON 格式文件', 'error');
        return;
      }

      const formData = new FormData();
      formData.append('file', file);

      try {
        const response = await fetch('/admin/api/backup/import', {
          method: 'POST',
          body: formData
        });
        const result = await response.json();
        
        if (result.success) {
          showMessage(result.message, 'success');
          fileInput.value = '';
        } else {
          showMessage(result.error || '导入失败', 'error');
        }
      } catch (err) {
        showMessage('导入失败', 'error');
      }
    }

    function setBackupSchedule(frequency) {
      showMessage(`已设置${frequency === 'daily' ? '每日' : frequency === 'weekly' ? '每周' : '每月'}自动备份`, 'success');
    }
  </script>
</body>
</html>
