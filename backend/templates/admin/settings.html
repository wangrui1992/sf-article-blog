<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>系统设置</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg: #0d1117; --bg-card: #161b22; --border: #30363d; --accent: #58a6ff; --accent-green: #3fb950; --accent-red: #f85149; --text: #e6edf3; --text-secondary: #8b949e; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    .sidebar { position: fixed; left: 0; top: 0; width: 240px; height: 100vh; background: var(--bg-card); border-right: 1px solid var(--border); padding: 24px 16px; }
    .sidebar-logo { font-family: monospace; font-size: 18px; font-weight: 500; margin-bottom: 32px; padding-left: 12px; }
    .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px; color: var(--text-secondary); text-decoration: none; border-radius: 8px; margin-bottom: 4px; font-size: 14px; transition: all 0.2s; }
    .nav-item:hover, .nav-item.active { background: rgba(88,166,255,0.1); color: var(--accent); }
    .main { margin-left: 240px; padding: 32px; max-width: 800px; }
    .page-header { margin-bottom: 32px; }
    .page-header h1 { font-size: 28px; font-weight: 600; }
    .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; margin-bottom: 24px; }
    .card h2 { font-size: 18px; font-weight: 600; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 8px; }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%; padding: 12px 16px; background: var(--bg); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); font-size: 14px;
    }
    .form-group input:focus, .form-group select:focus { outline: none; border-color: var(--accent); }
    .btn { padding: 10px 20px; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; border: none; }
    .btn-primary { background: var(--accent); color: #0d1117; }
    .toggle { display: flex; align-items: center; gap: 12px; }
    .toggle input[type="checkbox"] { width: 20px; height: 20px; cursor: pointer; }
    .message { padding: 12px 16px; border-radius: 8px; margin-bottom: 20px; display: none; }
    .message.success { background: rgba(63,185,80,0.1); border: 1px solid rgba(63,185,80,0.3); color: var(--accent-green); }
  </style>
</head>
<body>
  <nav class="sidebar">
    <div class="sidebar-logo">~/admin</div>
    <a href="/dashboard" class="nav-item">📊 仪表盘</a>
    <a href="/article/list" class="nav-item">📝 文章管理</a>
    <a href="/admin/users" class="nav-item">👥 用户管理</a>
    <a href="/admin/settings" class="nav-item active">⚙️ 系统设置</a>
    <a href="/admin/backup" class="nav-item">💾 数据备份</a>
    <a href="/auth/logout" class="nav-item">🚪 退出登录</a>
  </nav>

  <main class="main">
    <div class="page-header">
      <h1>系统设置</h1>
    </div>

    <div id="message" class="message"></div>

    <div class="card">
      <h2>基本设置</h2>
      <form id="settingsForm">
        <div class="form-group">
          <label>网站名称</label>
          <input type="text" id="siteName" value="博客管理系统">
        </div>
        <div class="form-group">
          <label>网站描述</label>
          <input type="text" id="siteDesc" value="个人技术博客后台">
        </div>
        <div class="form-group">
          <label>每页文章数</label>
          <input type="number" id="postsPerPage" value="20" min="5" max="100">
        </div>
      </form>
    </div>

    <div class="card">
      <h2>用户设置</h2>
      <div class="form-group toggle">
        <input type="checkbox" id="allowRegister" checked>
        <label for="allowRegister">允许新用户注册</label>
      </div>
      <div class="form-group toggle">
        <input type="checkbox" id="requireEmail">
        <label for="requireEmail">注册时验证邮箱</label>
      </div>
    </div>

    <div class="card">
      <h2>安全设置</h2>
      <div class="form-group toggle">
        <input type="checkbox" id="maintenanceMode">
        <label for="maintenanceMode">维护模式（仅管理员可访问）</label>
      </div>
    </div>

    <button class="btn btn-primary" onclick="saveSettings()">保存设置</button>
  </main>

  <script>
    async function loadSettings() {
      try {
        const response = await fetch('/admin/api/settings');
        const result = await response.json();
        if (result.success && result.data) {
          const d = result.data;
          document.getElementById('siteName').value = d.site_name || '';
          document.getElementById('siteDesc').value = d.site_description || '';
          document.getElementById('postsPerPage').value = d.posts_per_page || 20;
          document.getElementById('allowRegister').checked = d.allow_register !== false;
          document.getElementById('maintenanceMode').checked = d.maintenance_mode === true;
        }
      } catch (err) {
        console.error('加载设置失败:', err);
      }
    }

    async function saveSettings() {
      const data = {
        site_name: document.getElementById('siteName').value,
        site_description: document.getElementById('siteDesc').value,
        posts_per_page: parseInt(document.getElementById('postsPerPage').value),
        allow_register: document.getElementById('allowRegister').checked,
        maintenance_mode: document.getElementById('maintenanceMode').checked
      };

      try {
        const response = await fetch('/admin/api/settings', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        const result = await response.json();
        
        const msg = document.getElementById('message');
        msg.textContent = result.success ? '设置已保存' : '保存失败';
        msg.className = 'message success';
        msg.style.display = 'block';
        setTimeout(() => msg.style.display = 'none', 3000);
      } catch (err) {
        alert('保存失败');
      }
    }

    loadSettings();
  </script>
</body>
</html>
